plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'dev.blockbuddy'
version = "0.5.0"
base { archivesName = 'blockbuddy' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = "21.1.143"

    parchment {
        minecraftVersion = "1.21.1"
        mappingsVersion = "2024.11.17"
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', 'blockbuddy'
        }
    }

    mods {
        blockbuddy {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // Optional local NeoForge mods, such as Minescript, stay outside the shipped jar.
    runtimeOnly fileTree(dir: 'libs', include: ['*.jar'])
}

jar {
    manifest {
        attributes 'Implementation-Title': 'blockbuddy',
                   'Implementation-Version': project.version,
                   'Specification-Title': 'blockbuddy',
                   'Specification-Version': '1',
                   'Implementation-Vendor': 'blockbuddy'
    }
}
